name: Build Docker
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY: docker.io
      IMAGE_NAME: blocknetdx/utxo-plugin
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub 
      uses: docker/login-action@v3
#      continue-on-error: true # (optional for local testing) 
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.org_blocknetdximg_username }}
        password: ${{ secrets.org_blocknetdximg_password }}
    
    - name: Extract metadata
      id: meta
      run: |
        BRANCH_NAME="${GITHUB_REF#refs/heads/}"
        TAG="${BRANCH_NAME//\//_}"
        echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        if [[ "$BRANCH_NAME" == "main" ]]; then
          echo "is_main=true" >> $GITHUB_OUTPUT
        else
          echo "is_main=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Build and export image
      run: |
        docker build \
          --file Dockerfile \
          --tag ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
          --tag ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.branch }} \
          .
        if [[ "${{ steps.meta.outputs.is_main }}" == "true" ]]; then
          docker tag ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} ${{ env.IMAGE_NAME }}:latest
        fi
    
    - name: Push images
      run: |
        docker push ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
        docker push ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.branch }}
        if [[ "${{ steps.meta.outputs.is_main }}" == "true" ]]; then
          docker push ${{ env.IMAGE_NAME }}:latest
        fi
    
    - name: Clean up Docker resources
      run: |
        docker system prune -f
