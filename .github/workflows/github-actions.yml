name: build docker

# Every push, tag and pull request builds the image and runs the test suite.
# A push to `main` or `dev` also publishes `:<branch>` to Docker Hub when its
# credentials exist, plus `:latest` on main; every other ref and every pull
# request only builds and tests. Without Docker Hub credentials (a fork) the
# image is published to the GitHub Container Registry instead, as
# ghcr.io/<owner>/<repo>:<ref>, using the workflow token.
#
# A fork can publish to its own Docker Hub namespace by setting the
# repository variable DOCKERHUB_IMAGE and the DOCKERHUB_USERNAME /
# DOCKERHUB_PASSWORD secrets; the defaults target the upstream blocknetdx
# Docker Hub organisation.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request runs are cancelled; pushes queue instead so a
# publish is never interrupted half-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'blocknetdx/utxo-plugin' }}

jobs:

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
      with:
        # Keep the auth token out of .git/config: the build context below is
        # copied into the image and pushed to a public registry.
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install ruff
      run: pip install "ruff==0.16.9"
    - name: Ruff check
      run: ruff check .
    - name: Ruff format check
      run: ruff format --check .

  build:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      # Only the username decides whether publishing is possible, so only it
      # is job-wide; the token is scoped to the login step below. Secrets
      # cannot be referenced from `if:`, hence env plus a step output.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || secrets.org_blocknetdximg_username }}
    steps:
    - uses: actions/checkout@v5
      with:
        # Keep the auth token out of .git/config: the build context below is
        # copied into the image and pushed to a public registry.
        persist-credentials: false

    - name: Resolve image tag
      id: meta
      # `${GITHUB_REF#refs/heads/}` yields an invalid tag for tags
      # (`refs/tags/v1`) and for any branch containing a `/`. Docker's tag
      # charset is narrower still, so map everything outside it.
      run: |
        tag="$(printf '%s' "$GITHUB_REF_NAME" | tr 'A-Z' 'a-z' \
          | sed -e 's#[^a-z0-9._-]#-#g' -e 's#^[^a-z0-9]*##' -e 's#[^a-z0-9]*$##')"
        tag="${tag:-push}"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "image=$IMAGE:$tag" >> "$GITHUB_OUTPUT"
        echo "Building $IMAGE:$tag"

    - name: Build image
      run: docker build . --file Dockerfile --tag "${{ steps.meta.outputs.image }}"

    - name: Test image
      run: >-
        docker run --rm --entrypoint sh "${{ steps.meta.outputs.image }}"
        -c 'pip install --no-cache-dir -q "pytest==9.1.1" && python3 -m pytest -q'

    - name: Decide whether to publish
      id: publish
      # Only main and dev publish to Docker Hub, and pull requests never do.
      # A missing username means a fork without credentials, which publishes
      # to GHCR instead.
      run: |
        case "$GITHUB_REF" in
          refs/heads/main|refs/heads/dev) publishable=true ;;
          *) publishable=false ;;
        esac
        if [ -n "$DOCKERHUB_USERNAME" ]; then
          echo "ghcr=false" >> "$GITHUB_OUTPUT"
        else
          echo "ghcr=true" >> "$GITHUB_OUTPUT"
        fi
        if [ "$publishable" = true ] && [ -n "$DOCKERHUB_USERNAME" ] \
           && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Credentials present: image will be pushed to $IMAGE."
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "Build only."
          if [ "$publishable" = true ] && [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::warning::$GITHUB_REF pushed without Docker Hub credentials: publishing to GHCR instead."
          fi
        fi

    - name: Login to DockerHub
      if: steps.publish.outputs.enabled == 'true'
      env:
        DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD || secrets.org_blocknetdximg_password }}
      run: echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

    - name: Push image
      if: steps.publish.outputs.enabled == 'true'
      run: docker push "${{ steps.meta.outputs.image }}"

    - name: Push latest
      if: steps.publish.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
      run: |
        docker tag "${{ steps.meta.outputs.image }}" "$IMAGE:latest"
        docker push "$IMAGE:latest"

    # Fallback registry for a fork, where no Docker Hub credentials exist.
    # Restricted to GitHub-hosted runners so an emulated or self-hosted run
    # never pushes a package.
    - name: Login to GHCR
      if: >-
        steps.publish.outputs.ghcr == 'true'
        && github.event_name != 'pull_request'
        && runner.environment == 'github-hosted'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

    - name: Push image to GHCR
      if: >-
        steps.publish.outputs.ghcr == 'true'
        && github.event_name != 'pull_request'
        && runner.environment == 'github-hosted'
      run: |
        ghcr="ghcr.io/${GITHUB_REPOSITORY,,}"
        docker tag "${{ steps.meta.outputs.image }}" "$ghcr:${{ steps.meta.outputs.tag }}"
        docker push "$ghcr:${{ steps.meta.outputs.tag }}"
        if [ "$GITHUB_REF" = "refs/heads/main" ]; then
          docker tag "${{ steps.meta.outputs.image }}" "$ghcr:latest"
          docker push "$ghcr:latest"
        fi
